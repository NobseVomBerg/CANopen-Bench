[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canopen-bench"
version = "1.0.99"
description = "CANopen Bench — web tool to test and control CANopen devices (IXXAT, PCAN, demo mode; vendor hardware and device families via plugins)"
readme = "README.md"
license = "MIT"
# THIRD-PARTY-NOTICES.md carries the attribution required by the bundled
# Preact (MIT) and htm (Apache-2.0) in static/vendor/, plus the LGPL note
# for python-can — it has to travel with every wheel and sdist.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{name = "NobseVomBerg"}]
keywords = ["canopen", "can", "cia301", "eds", "test-bench", "sdo", "pdo", "nmt", "lss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.10"
dependencies = [
    # Starlette, not FastAPI: this app has one POST endpoint with two
    # fields and one WebSocket. FastAPI adds request-model validation and
    # OpenAPI on top of Starlette, neither of which is used here, and pulls
    # pydantic + its compiled core along for it.
    "starlette>=0.37",
    # Plain uvicorn, not uvicorn[standard]: that extra is a throughput
    # bundle (uvloop, httptools, watchfiles, python-dotenv) for servers
    # under load, which a localhost bench tool is not. websockets is the
    # one piece of it actually needed — it carries the state channel.
    "uvicorn>=0.29",
    "websockets>=12",
    # canopen/python-can are core dependencies: CanopenBus is the hardware
    # backend, and demo mode parses real .eds files through canopen's own
    # importer.
    "python-can>=4.4",
    "canopen>=2.3",
    # test-case files (TestCases folder) are YAML, see docs/ablaeufe/testfall-format.md
    "pyyaml>=6",
]

[project.optional-dependencies]
# bench instruments on a serial port (power supplies, canopen_bench/
# instruments/) — optional because a bench without one works fine, and
# the box says what to install when it is missing
serial = ["pyserial>=3.5"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.urls]
Homepage = "https://unsix.de"
Repository = "https://github.com/NobseVomBerg/CANopen-Bench"
Issues = "https://github.com/NobseVomBerg/CANopen-Bench/issues"
Changelog = "https://github.com/NobseVomBerg/CANopen-Bench/blob/main/CHANGELOG.md"

[project.scripts]
canopen-bench = "canopen_bench.__main__:main"

# Extension packages register bench plugins under the entry-point group
# "canopen_bench.plugins" (see canopen_bench/plugin.py) and python-can
# drivers under python-can's own "can.interface" group — the neutral core
# itself registers neither; see docs/extending.md.

[tool.setuptools.packages.find]
include = ["canopen_bench*"]

[tool.setuptools.package-data]
# seed/*.eds is what makes demo mode work after a plain `pip install`:
# it is read at runtime (core.SEED_EDS), so it has to be in the wheel.
# testReportStyle.css is the report stylesheet, written into the results
# folder on first use (report.default_css) — a file, not a string in
# report.py, so it can be edited and diffed as the CSS it is.
canopen_bench = ["static/**/*", "flows/*.yaml", "panels/*.yaml", "seed/*.eds",
                 "testReportStyle.css"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pyflakes/pycodestyle errors + sorted imports; deliberately no rules that
# fight this codebase's style (broad except at the hardware seam, naive
# local timestamps on a bench tool)
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
source = ["canopen_bench"]
