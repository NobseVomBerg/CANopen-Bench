# CiA-301 NMT-Zustandsautomat: durchläuft alle vier NMT-Kommandos und
# bestätigt den erwarteten Heartbeat-Zustand nach jedem — Heartbeat *ist*
# hier der Test, nicht ein separater Fall. Endet mit `nmt: start`, damit das
# Gerät nicht im Stop/Reset zurückbleibt. Format: docs/ablaeufe/testfall-format.md
id: "0003"
name: "NMT state transitions"
tools: []
est: "0.5 s"

preconditions:
  - sdo_read: {index: "0x1000", sub: "0x00"}          # DUT erreichbar, sonst SKIP

steps:
  - nmt: start
  - wait_for: {heartbeat: operational, timeout: 2.0}
  - nmt: preop
  - wait_for: {heartbeat: pre-operational, timeout: 2.0}
  - nmt: stop
  - wait_for: {heartbeat: stopped, timeout: 2.0}
  - nmt: resetcomm
  - wait_for: {heartbeat: pre-operational, timeout: 2.0}   # Zustand nach Reset Communication
  - nmt: start                                             # Gerät wieder im Normalbetrieb verlassen
  - wait_for: {heartbeat: operational, timeout: 2.0}
