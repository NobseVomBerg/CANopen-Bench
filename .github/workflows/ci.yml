name: CI

on:
  # Every branch, not just main: work happens on branches (see CLAUDE.md)
  # and "merge once CI is green" needs CI to have run before the merge.
  # Restricting this to main meant a branch push produced no run at all
  # unless someone opened a pull request for it.
  push:
  # Forks cannot trigger the above, so keep this for outside contributions.
  # A pull request from a branch in this repo runs twice; that is the
  # cheaper problem.
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.10 is the floor (requires-python) and the one that catches
        # you; 3.14 is the ceiling anyone is actually running. Both ends
        # are in because a version this claims support for and never
        # runs is a claim, not a fact.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The bench itself runs on Windows, where a text file writes two
          # bytes for every line end. Linux never sees that, so the live
          # report's byte offsets were off there while every run here
          # stayed green. One version shows the platform; the Linux rows
          # cover the versions.
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the single commit checkout fetches by default:
          # test_the_version_moves_when_the_tool_does compares this commit's
          # version against the main it merges into, and cannot read a
          # pyproject.toml from a commit that was never fetched.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      # The install brought cob-cpcusb from PyPI as a dependency. Out it goes:
      # the core is supposed to work plugin-free, and this run is the evidence.
      - name: Remove the plugin package
        run: python -m pip uninstall -y cob-cpcusb

      - name: Core tests
        run: python -m pytest tests/ --cov=canopen_bench -q

      # this checkout's, not the PyPI release the install brought
      - name: Install plugin package
        run: python -m pip install -e ./plugins/cob-cpcusb

      # The core suite again, now with a plugin's entry points registered —
      # it must still pass unchanged, which is what makes the core neutral.
      - name: Core tests with a plugin installed
        run: python -m pytest tests/ -q

      - name: Plugin tests
        run: python -m pytest plugins/cob-cpcusb/tests -q

  # The Dockerfile once sat on main for days with a line that could not
  # build, because nothing here ever built it. Built and started on every push now,
  # the way publish.yml will build it for GHCR (one platform: a second one
  # under emulation costs minutes and finds what this already finds).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t canopen-bench .

      # libusb is in the image for the CPC-USB driver alone, so ask pyusb
      # for it rather than trusting the apt line
      - name: libusb is there
        run: docker run --rm canopen-bench python -c "import usb.backend.libusb1 as b; assert b.get_backend(), 'no libusb'"

      - name: Starts and answers with this version
        run: |
          docker run -d --name bench -p 8000:8000 canopen-bench
          for i in $(seq 30); do curl -fs http://127.0.0.1:8000/api/state -o state.json && break; sleep 1; done
          [ -s state.json ] || { echo 'no answer within 30 s'; docker logs bench; exit 1; }
          want=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          got=$(python3 -c "import json; print(json.load(open('state.json'))['version'])")
          echo "image answers $got, pyproject says $want"
          [ "$got" = "$want" ] || { docker logs bench; exit 1; }
