name: CI

on:
  # Every branch, not just main: work happens on branches (see CLAUDE.md)
  # and "merge once CI is green" needs CI to have run before the merge.
  # Restricting this to main meant a branch push produced no run at all
  # unless someone opened a pull request for it.
  push:
  # Forks cannot trigger the above, so keep this for outside contributions.
  # A pull request from a branch in this repo runs twice; that is the
  # cheaper problem.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor (requires-python) and the one that catches
        # you; 3.14 is the ceiling anyone is actually running. Both ends
        # are in because a version this claims support for and never
        # runs is a claim, not a fact.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the single commit checkout fetches by default:
          # test_the_version_moves_when_the_tool_does compares this commit's
          # version against the main it merges into, and cannot read a
          # pyproject.toml from a commit that was never fetched.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      # Deliberately before the plugin is installed: the core is supposed to
      # work plugin-free, and this run is the evidence.
      - name: Core tests
        run: python -m pytest tests/ --cov=canopen_bench -q

      - name: Install plugin package
        run: python -m pip install -e ./plugins/cob-cpcusb

      # The core suite again, now with a plugin's entry points registered —
      # it must still pass unchanged, which is what makes the core neutral.
      - name: Core tests with a plugin installed
        run: python -m pytest tests/ -q

      - name: Plugin tests
        run: python -m pytest plugins/cob-cpcusb/tests -q
