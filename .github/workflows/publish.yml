name: Publish to PyPI

# By hand only (Actions > Publish to PyPI > Run workflow): main is the current
# state (CONTRIBUTING.md, "Versioning"), and not every merge needs to reach
# PyPI. The upload carries the version the package's pyproject.toml has; PyPI
# takes each version once, so running it twice on the same state fails rather
# than replacing anything. For canopen-bench the same state also goes to
# GHCR as a container image (the image job at the end).
on:
  workflow_dispatch:
    inputs:
      # Both distributions in this repository publish through this one
      # workflow and environment, each registered as a publisher on its own
      # PyPI project.
      package:
        description: Which package to publish
        type: choice
        options: [canopen-bench, cob-cpcusb]
        default: canopen-bench

jobs:
  build:
    # Run workflow offers every branch; only main is a state anyone can look up.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # --strict fails on a README PyPI would render badly, before anything
      # is uploaded
      - name: Build and check
        id: build
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            canopen-bench) src=. ; prefix=v ;;
            cob-cpcusb)    src=plugins/cob-cpcusb ; prefix=cob-cpcusb-v ;;
            *) echo "unknown package: $PACKAGE"; exit 1 ;;
          esac
          python -m pip install build twine
          python -m build "$src" --outdir dist
          python -m twine check --strict dist/*
          version=$(python -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "$src/pyproject.toml")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$prefix$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI accepts the upload because it comes from this
    # workflow in this environment, as registered under the project's
    # publishers on pypi.org. No token is stored anywhere. The environment's
    # required reviewer is the last look before a version is final.
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # A tag on the commit the upload was built from, and a GitHub Release for
  # whoever watches the repository: the merges since the package's previous
  # tag, plus the files that went to PyPI. Its own job, so the upload never
  # holds write access to the repository. The plugin's releases are never
  # marked latest; the repository page shows the bench's.
  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          case "$PACKAGE" in
            canopen-bench) paths=". :!plugins" ; latest=true ;;
            cob-cpcusb)    paths="plugins/cob-cpcusb" ; latest=false ;;
          esac
          prev=$(git describe --tags --abbrev=0 --match "${TAG%"$VERSION"}[0-9]*" 2>/dev/null || true)
          {
            echo "\`pip install $PACKAGE==$VERSION\` · [PyPI](https://pypi.org/project/$PACKAGE/$VERSION/)"
            if [ -n "$prev" ]; then
              echo
              echo "Merged since $prev:"
              echo
              git log --first-parent --merges --format='- %s' "$prev..HEAD" -- $paths \
                | sed -E "s/^- Merge branch '[^']*': /- /"
            fi
          } > notes.md
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "$PACKAGE $VERSION" --notes-file notes.md --latest=$latest

  # The container image of the same state: ghcr.io/nobsevomberg/canopen-bench,
  # tagged with the version and latest, for amd64 and arm64 (a Raspberry Pi
  # is a common computer on a bench). A job here rather than a workflow on
  # "release published": a release this workflow creates with GITHUB_TOKEN
  # starts no other workflow. GHCR needs no account of its own, the token
  # pushes as the repository. A new package starts out private: Package
  # settings > Change visibility > Public, once, after its first push.
  image:
    needs: [build, publish]
    if: inputs.package == 'canopen-bench'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation on the amd64 runner
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # labels too: org.opencontainers.image.source is what links the
      # package to this repository on GitHub
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/nobsevomberg/canopen-bench
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
